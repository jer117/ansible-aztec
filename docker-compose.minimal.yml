name: aztec-node-minimal

services:
  node:
    image: aztecprotocol/aztec:2.1.9-arm64
    environment:
      KEY_STORE_DIRECTORY: /var/lib/keystore
      DATA_DIRECTORY: /var/lib/data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ETHEREUM_HOSTS: ${ETHEREUM_HOSTS}
      L1_CONSENSUS_HOST_URLS: ${L1_CONSENSUS_HOST_URLS}
      P2P_IP: ${P2P_IP}
      P2P_PORT: ${P2P_PORT}
      AZTEC_PORT: ${AZTEC_PORT}
      AZTEC_ADMIN_PORT: ${AZTEC_ADMIN_PORT}
    entrypoint: >
      sh -c 'node --no-warnings /usr/src/yarn-project/aztec/dest/bin/index.js start --node --archiver --sequencer --network $NETWORK --data-store-map-size-kb=2262144'
    ports:
      - ${AZTEC_PORT}:${AZTEC_PORT}
      - ${AZTEC_ADMIN_PORT}:${AZTEC_ADMIN_PORT}
      - ${P2P_PORT}:${P2P_PORT}/tcp
      - ${P2P_PORT}:${P2P_PORT}/udp
    volumes:
      - ${DATA_DIRECTORY}:/var/lib/data
      - ${KEY_STORE_DIRECTORY}:/var/lib/keystore
    restart: always
    deploy:
      resources:
        limits:
          # LMDB memory-mapped files require virtual address space reservation
          # Even though not all physical RAM is used immediately, Docker's memory limit
          # affects virtual memory allocation. With 5 maps × 10GB default = 50GB total,
          # we need sufficient memory limit to allow the OS to reserve address space.
          # If env vars work (256MB × 5 = 1.25GB), 2-3GB would suffice.
          # With defaults (10GB × 5 = 50GB), may need 16-20GB+ to allow address space reservation
          memory: 16G
        reservations:
          memory: 4G
    # Add this if you have a external network
    # networks:
    #   - $DOCKER_NETWORK

  aztec-collector:
    image: jer117/aztec-collector:sha-5930307
    restart: unless-stopped
    ports:
      - "13285:13285"
    environment:
      - AZTEC_COLLECTOR_PROTOCOL_RPC_URL=http://node:$AZTEC_PORT
      - AZTEC_COLLECTOR_PROTOCOL_ADMIN_URL=http://node:$AZTEC_ADMIN_PORT
      - AZTEC_COLLECTOR_INTERVAL=30s
      - AZTEC_COLLECTOR_API_ENABLED=true
      - AZTEC_COLLECTOR_API_LISTEN=0.0.0.0:13285
      - AZTEC_COLLECTOR_JSONLOG_PATH=/data/aztec-collector.json
    volumes:
      - ${CONFIG_FILE}:/app/config.yaml:ro
      - ${COLLECTOR_DATA_DIRECTORY}:/data
    depends_on:
      - node
    # Add this if you have a external network
    # networks:
    #   - $DOCKER_NETWORK
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13285/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s   # Reuse the pre-e

# Only define external network if DOCKER_NETWORK is set
# If not set or empty, comment out this section and remove network references from services above
# networks:
#   ${DOCKER_NETWORK}:
#     external: ${DOCKER_NETWORK:+true}
#     name: ${DOCKER_NETWORK}

